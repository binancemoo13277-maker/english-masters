<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم English Masters</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Cairo,system-ui,sans-serif;color:#161616}.wrap{width:min(100% - 24px,1050px);margin:24px auto 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;font-size:28px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:18px;box-shadow:0 7px 20px rgba(0,0,0,.04);margin-bottom:14px}.login{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.login input{min-width:260px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}.tab.active{background:#111;color:#fff}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:800;color:#444}.field input,.field textarea{border:1px solid #d9d9d9;border-radius:10px;padding:10px 12px;font:inherit;background:#fff}.field textarea{min-height:92px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#ef233c;color:#fff}.dark{background:#111;color:#fff}.soft{background:#f0f0f0}.savebar{position:sticky;bottom:12px;display:flex;justify-content:flex-start;gap:8px;background:#fffffff0;border:1px solid #e3e3e3;border-radius:14px;padding:10px;backdrop-filter:blur(7px);margin-top:15px}.hint{font-size:12px;color:#777}.imgPrev{width:170px;max-height:110px;object-fit:cover;border:1px solid #ddd;border-radius:10px;margin-top:6px}.status{font-weight:800;font-size:13px}.ok{color:#0a8c48}.bad{color:#c1121f}.orders{overflow:auto}.orders table{width:100%;border-collapse:collapse;min-width:760px}.orders th,.orders td{border-bottom:1px solid #eee;padding:9px;text-align:right;font-size:13px}.orders th{background:#fafafa}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top h1{font-size:23px}.login input{min-width:0;flex:1}}
</style></head><body><div class="wrap"><div class="top"><div><h1>لوحة التحكم</h1><div class="hint">عدّل المحتوى ثم اضغط حفظ. التغييرات تظهر على الموقع مباشرة.</div></div><a href="/" target="_blank" class="btn soft" style="text-decoration:none;color:#111">فتح الموقع ↗</a></div>
<div class="card"><div class="login"><input id="password" type="password" placeholder="كلمة مرور الإدارة"><button class="btn dark" id="connect">دخول / تحديث</button><span class="status" id="status"></span></div></div>
<div class="tabs"><button class="tab active" data-tab="content">المحتوى</button><button class="tab" data-tab="orders">الطلبات</button></div>
<div class="section active" id="contentSec"><div class="card"><div class="grid">
<div class="field full"><label>الشريط العلوي</label><input id="topBar"></div><div class="field"><label>شارة العرض</label><input id="heroBadge"></div><div class="field"><label>نص العداد</label><input id="timerText"></div>
<div class="field full"><label>العنوان الرئيسي</label><input id="heroTitle"></div><div class="field full"><label>الوصف تحت العنوان</label><textarea id="heroLead"></textarea></div>
<div class="field"><label>السعر الحالي</label><input id="priceNow" inputmode="decimal"></div><div class="field"><label>السعر القديم</label><input id="priceOld" inputmode="decimal"></div><div class="field"><label>العملة</label><input id="currency"></div><div class="field"><label>نص زر الطلب</label><input id="cta"></div>
<div class="field full"><label>صورة المنتج الرئيسية</label><input id="heroImage"><input type="file" id="heroFile" accept="image/*"><img id="heroPrev" class="imgPrev"></div>
<div class="field full"><label>عنوان المميزات</label><input id="benefitsTitle"></div><div class="field full"><label>المميزات — كل سطر ميزة</label><textarea id="benefits"></textarea></div>
<div class="field"><label>عنوان قسم الإقناع</label><input id="problemTitle"></div><div class="field full"><label>النص</label><textarea id="problemText"></textarea></div>
<div class="field full"><label>عنوان الباقة</label><input id="packageTitle"></div><div class="field full"><label>صورة الباقة</label><input id="packageImage"><input type="file" id="packageFile" accept="image/*"><img id="packagePrev" class="imgPrev"></div><div class="field full"><label>محتويات الباقة — كل سطر عنصر</label><textarea id="packageItems"></textarea></div>
<div class="field full"><label>عنوان الهدايا</label><input id="giftsTitle"></div><div class="field full"><label>الهدايا — كل سطر هدية</label><textarea id="gifts"></textarea></div>
<div class="field full"><label>عنوان آراء العملاء</label><input id="reviewsTitle"></div><div class="field full"><label>آراء العملاء — كل سطر بالشكل: الاسم | الرأي</label><textarea id="reviews"></textarea></div>
<div class="field"><label>عنوان فورم الطلب</label><input id="orderTitle"></div><div class="field"><label>وصف فورم الطلب</label><input id="orderHint"></div><div class="field full"><label>الفوتر</label><input id="footer"></div>
</div></div><div class="savebar"><button class="btn primary" id="save">حفظ التعديلات</button><span class="status" id="saveStatus"></span></div></div>
<div class="section" id="ordersSec"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">آخر الطلبات</h2><button class="btn dark" id="reloadOrders">تحديث</button></div><div class="orders" id="ordersBox" style="margin-top:12px"></div></div></div>
</div><script>
let content={};const ids=['topBar','heroBadge','timerText','heroTitle','heroLead','priceNow','priceOld','currency','cta','heroImage','benefitsTitle','problemTitle','problemText','packageTitle','packageImage','giftsTitle','reviewsTitle','orderTitle','orderHint','footer'];
function pass(){return password.value.trim()}function lines(v){return (v||'').split('\n').map(x=>x.trim()).filter(Boolean)}function setStatus(el,msg,ok=true){el.textContent=msg;el.className='status '+(ok?'ok':'bad')}
async function loadContent(){setStatus(status,'جاري التحميل...');try{const r=await fetch('/api/content',{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();content=j.content||{};ids.forEach(id=>{document.getElementById(id).value=content[id]??''});benefits.value=(content.benefits||[]).join('\n');packageItems.value=(content.packageItems||[]).join('\n');gifts.value=(content.gifts||[]).join('\n');reviews.value=(content.reviews||[]).map(r=>`${r.name} | ${r.text}`).join('\n');heroPrev.src=content.heroImage||'';packagePrev.src=content.packageImage||'';setStatus(status,'تم تحميل المحتوى')}catch{setStatus(status,'تعذر تحميل المحتوى',false)}}
async function fileToData(input,target,preview){const f=input.files[0];if(!f)return;if(f.size>1800000){alert('الصورة كبيرة. استخدم صورة أقل من 1.8MB');input.value='';return}const reader=new FileReader();reader.onload=()=>{target.value=reader.result;preview.src=reader.result};reader.readAsDataURL(f)}heroFile.onchange=()=>fileToData(heroFile,heroImage,heroPrev);packageFile.onchange=()=>fileToData(packageFile,packageImage,packagePrev);heroImage.oninput=()=>heroPrev.src=heroImage.value;packageImage.oninput=()=>packagePrev.src=packageImage.value;
function collect(){const c={...content};ids.forEach(id=>c[id]=document.getElementById(id).value.trim());c.benefits=lines(benefits.value);c.packageItems=lines(packageItems.value);c.gifts=lines(gifts.value);c.reviews=lines(reviews.value).map(x=>{const i=x.indexOf('|');return i>-1?{name:x.slice(0,i).trim(),text:x.slice(i+1).trim()}:{name:'عميل',text:x}});return c}
save.onclick=async()=>{if(!pass())return setStatus(saveStatus,'اكتب كلمة المرور',false);setStatus(saveStatus,'جاري الحفظ...');try{const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pass()},body:JSON.stringify({content:collect()})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'فشل الحفظ');content=collect();setStatus(saveStatus,'تم الحفظ ✓')}catch(e){setStatus(saveStatus,e.message||'فشل الحفظ',false)}};
async function loadOrders(){if(!pass())return setStatus(status,'اكتب كلمة المرور أولًا',false);ordersBox.innerHTML='جاري التحميل...';try{const r=await fetch('/api/orders',{headers:{'X-Admin-Password':pass()}});const j=await r.json();if(!r.ok)throw new Error(j.error||'تعذر تحميل الطلبات');const arr=j.orders||[];ordersBox.innerHTML=arr.length?`<table><thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>المحافظة</th><th>الكمية</th><th>العنوان</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody>${arr.map(o=>`<tr><td>${o.id}</td><td>${o.name}</td><td>${o.phone}</td><td>${o.city||''}</td><td>${o.qty}</td><td>${o.address||''}</td><td>${o.total||''}</td><td>${new Date(o.created_at).toLocaleString('ar-JO')}</td></tr>`).join('')}</tbody></table>`:'لا توجد طلبات بعد';}catch(e){ordersBox.textContent=e.message||'تعذر تحميل الطلبات'}}
connect.onclick=()=>{loadContent();if(pass())loadOrders()};reloadOrders.onclick=loadOrders;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab==='content'?'contentSec':'ordersSec').classList.add('active');if(b.dataset.tab==='orders')loadOrders()});loadContent();
</script></body></html>
