<title>لوحة تحكم English Masters</title>

.card{background:#fff;border:1px solid #e6e6e6;border-radius:16px;padding:17px;box-shadow:0 6px 22px rgba(0,0,0,.04);margin-bottom:14px}

.panel{display:none}.panel.active{display:block}
details.editor{background:#fff;border:1px solid #e5e5e5;border-radius:14px;margin-bottom:10px;overflow:hidden}details.editor summary{padding:14px 16px;font-weight:900;cursor:pointer;background:#fff}details.editor[open] summary{border-bottom:1px solid #eee}

.savebar{position:sticky;bottom:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid #ddd;border-radius:13px;padding:10px;display:flex;gap:10px;align-items:center;z-index:20}
.status{font-size:13px;font-weight:800}.ok{color:#078841}.bad{color:#c1121f}

<div class="wrap">
  <div class="top">
    <div><h1>لوحة تحكم English Masters</h1><div class="hint">أي تعديل تحفظه يظهر على صفحة الهبوط مباشرة.</div></div>
    <a class="btn soft" href="/" target="_blank" style="text-decoration:none">فتح الموقع ↗</a>
  </div>
  <div class="card">
    <div class="login">
      <input id="password" type="password" placeholder="كلمة مرور الإدارة">
      <button class="btn dark" id="loginBtn">دخول / تحديث</button>
      <span id="loginStatus" class="status"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="content">تعديل الموقع</button>
    <button class="tab" data-tab="orders">الطلبات</button>
  </div>

  <div id="contentPanel" class="panel active">
    <div id="editor"></div>
    <div class="savebar">
      <button class="btn red" id="saveBtn">حفظ التعديلات</button>
      <button class="btn soft" id="resetBtn">استرجاع النصوص الأصلية</button>
      <span id="saveStatus" class="status"></span>
    </div>
  </div>

  <div id="ordersPanel" class="panel">
    <div class="card">
      <div class="ordersTop">
        <div><h2 style="margin:0">الطلبات <span class="count" id="orderCount"></span></h2><div class="hint">أحدث الطلبات تظهر أولًا.</div></div>
        <div style="display:flex;gap:8px"><button class="btn dark" id="reloadOrders">تحديث</button><button class="btn green" id="csvBtn">تصدير CSV</button></div>
      </div>
      <div class="orders" id="ordersBox">اكتب كلمة المرور ثم افتح الطلبات.</div>
    </div>
  </div>
</div>

le", "ميزة 1 - العنوان", "text"], ["digitalFeature1Text", "ميزة 1 - الوصف", "textarea"], ["digitalFeature2Title", "ميزة 2 - العنوان", "text"], ["digitalFeature2Text", "ميزة 2 - الوصف", "textarea"]]], ["الباقة والسعر", [["packageTitle", "عنوان الباقة", "text"], ["packageSub", "وصف الباقة", "textarea"], ["packageImage", "صورة الباقة", "image"], ["packageItem1", "محتوى الباقة 1", "text"], ["packageItem2", "محتوى الباقة 2", "text"], ["packageItem3", "محتوى الباقة 3", "text"], ["packageItem4", "محتوى الباقة 4", "text"], ["packageItem5", "محتوى الباقة 5", "text"], ["packageItem6", "محتوى الباقة 6", "text"], ["packageCta", "زر الباقة", "text"]]], ["الطلب والأسئلة والفوتر", [["orderBadge", "شارة الطلب", "text"], ["orderTitle", "عنوان نموذج الطلب", "text"], ["orderSub", "وصف نموذج الطلب", "textarea"], ["submitButton", "زر تأكيد الطلب", "text"], ["orderNote", "ملاحظة تحت الطلب", "textarea"], ["faqTitle", "عنوان الأسئلة", "text"], ["faq1Q", "سؤال 1", "text"], ["faq1A", "إجابة 1", "textarea"], ["faq2Q", "سؤال 2", "text"], ["faq2A", "إجابة 2", "textarea"], ["faq3Q", "سؤال 3", "text"], ["faq3A", "إجابة 3", "textarea"], ["faq4Q", "سؤال 4", "text"], ["faq4A", "إجابة 4", "textarea"], ["footerBrand", "اسم الفوتر", "text"], ["footerText", "نص الفوتر", "text"], ["mobileCtaText", "نص زر الموبايل", "text"], ["successTitle", "عنوان رسالة نجاح الطلب", "text"], ["successText", "نص رسالة نجاح الطلب", "textarea"]]]];
let content={...DEFAULT_CONTENT};
let orders=[];

const $=id=>document.getElementById(id);
function pass(){return $('password').value.trim()}
function status(el,msg,ok=true){el.textContent=msg;el.className='status '+(ok?'ok':'bad')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function renderEditor(){
  const root=$('editor'); root.innerHTML='';
  SECTIONS.forEach((section,si)=>{
    const [title,fields]=section;
    const details=document.createElement('details');
    details.className='editor';
    if(si===0) details.open=true;
    const summary=document.createElement('summary');summary.textContent=title;details.appendChild(summary);
    const grid=document.createElement('div');grid.className='fields';
    fields.forEach(([key,label,type])=>{
      const box=document.createElement('div');box.className='field '+((type==='textarea'||type==='image')?'full':'');
      const lab=document.createElement('label');lab.htmlFor='f_'+key;lab.textContent=label;box.appendChild(lab);
      if(type==='textarea'){
        const ta=document.createElement('textarea');ta.id='f_'+key;ta.dataset.key=key;ta.value=content[key]??'';box.appendChild(ta);
      } else if(type==='image'){
        const row=document.createElement('div');row.className='imageRow';
        const inp=document.createElement('input');inp.id='f_'+key;inp.dataset.key=key;inp.value=content[key]??'';inp.placeholder='رابط الصورة أو ارفع صورة';
        const upload=document.createElement('input');upload.type='file';upload.accept='image/*';upload.style.maxWidth='190px';
        const prev=document.createElement('img');prev.className='preview';prev.src=content[key]||'';prev.alt='';
        inp.addEventListener('input',()=>prev.src=inp.value);
        upload.addEventListener('change',async()=>{if(upload.files[0]){const data=await compressImage(upload.files[0]);inp.value=data;prev.src=data;}});
        row.append(inp,upload);box.append(row,prev);
      } else {
        const inp=document.createElement('input');inp.id='f_'+key;inp.dataset.key=key;inp.type=type==='number'?'number':'text';
        if(type==='number'){inp.step='0.1';inp.min='0';}
        inp.value=content[key]??'';box.appendChild(inp);
      }
      grid.appendChild(box);
    });
    details.appendChild(grid);root.appendChild(details);
  });
}

async function compressImage(file){
  if(file.size>8*1024*1024) throw new Error('الصورة أكبر من 8MB');
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data});
  const max=1200, scale=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/webp',.78);
}

function collect(){
  const out={...content};
  document.querySelectorAll('[data-key]').forEach(el=>out[el.dataset.key]=el.value.trim());
  return out;
}

function normalizeContent(raw){
  const out={...DEFAULT_CONTENT,...(raw||{})};
  if(String(out.price ?? '').trim()==='39.5' || !out.price) out.price='15';
  if(!out.shippingAmman) out.shippingAmman='2';
  if(!out.shippingOther) out.shippingOther='3';
  if(!out.topBarHighlight || String(out.topBarHighlight).includes('مجاني')) out.topBarHighlight='الدفع عند الاستلام';
  out.shippingText=`التوصيل: عمّان ${out.shippingAmman} د.أ | المحافظات ${out.shippingOther} د.أ`;
  out.packageShipping=`التوصيل: عمّان ${out.shippingAmman} د.أ | المحافظات ${out.shippingOther} د.أ`;
  out.faq1Q='كم تكلفة التوصيل؟';
  out.faq1A=`التوصيل داخل عمّان ${out.shippingAmman} د.أ، وباقي المحافظات ${out.shippingOther} د.أ.`;
  return out;
}

async function loadContent(){
  status($('loginStatus'),'جاري تحميل المحتوى...');
  try{
    const r=await fetch('/api/content',{cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'تعذر تحميل المحتوى');
    content=normalizeContent(j.content||{});
    renderEditor();
    status($('loginStatus'),'تم تحميل المحتوى ✓');
  }catch(e){content=normalizeContent({});renderEditor();status($('loginStatus'),e.message||'تعذر تحميل المحتوى',false)}
}

async function saveContent(){
  if(!pass()) return status($('saveStatus'),'اكتب كلمة المرور أولًا',false);
  status($('saveStatus'),'جاري الحفظ...');
  const next=normalizeContent(collect());
  try{
    const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pass()},body:JSON.stringify({content:next})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'فشل الحفظ');
    content=next;
    sessionStorage.setItem('em_admin_password',pass());
    status($('saveStatus'),'تم الحفظ ✓ افتح الموقع وشوف التعديل');
  }catch(e){status($('saveStatus'),e.message||'فشل الحفظ',false)}
}

async function loadOrders(){
  if(!pass()) return status($('loginStatus'),'اكتب كلمة المرور أولًا',false);
  $('ordersBox').textContent='جاري تحميل الطلبات...';
  try{
    const r=await fetch('/api/orders',{headers:{'X-Admin-Password':pass()},cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'تعذر تحميل الطلبات');
    orders=j.orders||[];
    $('orderCount').textContent='('+orders.length+')';
    sessionStorage.setItem('em_admin_password',pass());
    if(!orders.length){$('ordersBox').textContent='لا توجد طلبات حتى الآن.';return;}
    $('ordersBox').innerHTML=`<table><thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>المحافظة</th><th>الكمية</th><th>العنوان</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${escapeHtml(o.id)}</td><td>${escapeHtml(o.name)}</td><td>${escapeHtml(o.phone)}</td><td>${escapeHtml(o.city)}</td><td>${escapeHtml(o.qty)}</td><td>${escapeHtml(o.address)}</td><td>${escapeHtml(o.total)}</td><td>${escapeHtml(new Date(o.created_at).toLocaleString('ar-JO'))}</td></tr>`).join('')}</tbody></table>`;
  }catch(e){$('ordersBox').textContent=e.message||'تعذر تحميل الطلبات'}
}

function exportCsv(){
  if(!orders.length) return alert('لا توجد طلبات للتصدير');
  const rows=[['ID','الاسم','الهاتف','المحافظة','الكمية','العنوان','الإجمالي','التاريخ'],...orders.map(o=>[o.id,o.name,o.phone,o.city,o.qty,o.address,o.total,o.created_at])];
  const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='english-masters-orders.csv';a.click();URL.revokeObjectURL(a.href);
}

$('loginBtn').onclick=()=>{sessionStorage.setItem('em_admin_password',pass());loadContent();loadOrders()};
$('saveBtn').onclick=saveContent;
$('reloadOrders').onclick=loadOrders;
$('csvBtn').onclick=exportCsv;
$('resetBtn').onclick=()=>{if(confirm('ترجع كل النصوص والصور للقيم الأصلية؟')){content={...DEFAULT_CONTENT};renderEditor();status($('saveStatus'),'تم الاسترجاع داخل اللوحة — اضغط حفظ لتطبيقه')}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  $('contentPanel').classList.toggle('active',b.dataset.tab==='content');$('ordersPanel').classList.toggle('active',b.dataset.tab==='orders');
  if(b.dataset.tab==='orders') loadOrders();
});
$('password').value=sessionStorage.getItem('em_admin_password')||'';
renderEditor();
loadContent();
</script>
