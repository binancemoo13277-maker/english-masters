<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ef233c">
<title>English Masters الأردن</title>
<meta name="description" content="English Masters الأردن — تعلم الإنجليزية بخطة عملية مع توصيل مجاني ودفع عند الاستلام.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--r:#ef233c;--r2:#d90429;--g:#12a150;--ink:#171717;--muted:#666;--line:#ececec;--shadow:0 14px 36px rgba(0,0,0,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Cairo,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.75}.wrap{width:min(100% - 28px,940px);margin:auto}.center{text-align:center}img{max-width:100%;display:block}.top{background:var(--r);color:#fff;text-align:center;padding:9px 12px;font-weight:900}.hero{padding:28px 0 24px;background:linear-gradient(#fff,#fff6f7)}.badge{display:inline-block;background:#fff0b7;color:#624d00;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:900}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.3;margin:13px auto 8px;max-width:790px}.hero h1 span{color:var(--r)}.lead{font-size:18px;color:#444;max-width:700px;margin:0 auto 14px}.price{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.now{font-size:34px;font-weight:900;color:var(--r)}.old{text-decoration:line-through;color:#999;font-weight:700}.ship{background:#e9f9ef;color:#08743c;padding:6px 10px;border-radius:9px;font-weight:900}.heroimg{width:min(100%,720px);margin:12px auto 14px;border-radius:16px}.cta{display:inline-block;background:linear-gradient(var(--r),var(--r2));color:#fff;text-decoration:none;border:0;border-radius:13px;padding:14px 26px;font-size:19px;font-weight:900;box-shadow:0 10px 23px rgba(217,4,41,.25);cursor:pointer}.small{color:#777;font-size:13px;margin-top:8px}.timer{background:#111;color:#fff;padding:14px 10px;text-align:center;font-weight:800}.timer b{color:#ffd43b}section{padding:46px 0}.head{font-size:30px;line-height:1.4;margin:0 0 20px;text-align:center}.sub{max-width:760px;margin:-8px auto 22px;color:#5f5f5f;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.point{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff;text-align:center;font-weight:800}.point span{display:block;font-size:25px;margin-bottom:4px}.problem{background:#fff7f8}.problemBox{max-width:800px;margin:auto;background:#fff;border:1px solid #f3d7dc;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.04)}.problemBox p{margin:0;text-align:center;font-size:17px}.package{background:#fafafa}.packageBox{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center}.package img{border-radius:16px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid #e9e9e9;border-radius:12px;padding:12px 14px;font-weight:800}.giftsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.gift{border:1px solid #ececec;border-radius:13px;padding:14px;background:#fff;font-weight:800}.reviews{background:#fafafa}.reviewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.review{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.04)}.review p{margin:0 0 9px;color:#555;font-size:14px}.review b{font-size:13px}.order{background:#f5f5f5}.form{background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow);max-width:720px;margin:auto}.form h2{margin:6px 0 4px;text-align:center}.form .hint{text-align:center;color:#777;font-size:14px;margin:0 0 18px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{border:1px solid #d9d9d9;border-radius:10px;padding:11px 12px;font:inherit}.summary{background:#fff7f8;border:1px solid #f3cbd1;border-radius:12px;padding:12px;margin:15px 0;display:flex;justify-content:space-between;font-weight:900}.submit{width:100%;border:0;background:linear-gradient(#16b65d,#0b8f45);color:#fff;border-radius:12px;padding:14px;font:inherit;font-size:18px;font-weight:900;cursor:pointer}.mobile{display:none;position:fixed;bottom:0;left:0;right:0;background:#fffd;padding:8px 10px;backdrop-filter:blur(8px);z-index:20;border-top:1px solid #eee}.mobile .cta{width:100%;text-align:center;padding:11px;font-size:16px}footer{background:#111;color:#aaa;text-align:center;padding:23px 12px 80px;font-size:12px}.success{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.success>div{background:#fff;border-radius:16px;padding:25px;text-align:center;max-width:420px;width:100%}.close{border:0;background:#111;color:#fff;border-radius:9px;padding:9px 20px;font:inherit;font-weight:800}@media(max-width:720px){.grid,.reviewGrid,.packageBox,.formGrid,.giftsGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero h1{font-size:30px}.lead{font-size:16px}.head{font-size:25px}section{padding:36px 0}.mobile{display:block}.now{font-size:30px}}
</style></head>
<body>
<div class="top" id="topBar"></div>
<header class="hero center"><div class="wrap">
<span class="badge" id="heroBadge"></span>
<h1 id="heroTitle"></h1>
<p class="lead" id="heroLead"></p>
<div class="price"><span class="now" id="priceNow"></span><span class="old" id="priceOld"></span><span class="ship">توصيل مجاني</span></div>
<img class="heroimg" id="heroImage" alt="English Masters">
<a class="cta ctaText" href="#order"></a><div class="small">الدفع عند الاستلام</div>
</div></header>
<div class="timer"><span id="timerText"></span> <b><span id="hours">05</span>:<span id="mins">39</span>:<span id="secs">59</span></b></div>
<section><div class="wrap"><h2 class="head" id="benefitsTitle"></h2><div class="grid" id="benefits"></div></div></section>
<section class="problem"><div class="wrap"><div class="problemBox"><h2 class="head" id="problemTitle"></h2><p id="problemText"></p></div></div></section>
<section class="package"><div class="wrap packageBox"><div><img id="packageImage" alt="المجموعة كاملة"></div><div><h2 style="margin-top:0" id="packageTitle"></h2><div class="list" id="packageItems"></div><div style="margin-top:18px"><a class="cta ctaText" href="#order"></a></div></div></div></section>
<section><div class="wrap"><h2 class="head" id="giftsTitle"></h2><div class="giftsGrid" id="gifts"></div></div></section>
<section class="reviews"><div class="wrap"><h2 class="head" id="reviewsTitle"></h2><div class="reviewGrid" id="reviews"></div></div></section>
<section class="order" id="order"><div class="wrap"><div class="form"><span class="badge">الدفع عند الاستلام</span><h2 id="orderTitle"></h2><p class="hint" id="orderHint"></p><form id="orderForm"><div class="formGrid">
<div class="field"><label>الاسم</label><input name="name" required placeholder="الاسم الكامل"></div><div class="field"><label>رقم الهاتف</label><input name="phone" required inputmode="tel" placeholder="07XXXXXXXX"></div>
<div class="field"><label>المحافظة</label><select name="city" required><option value="">اختر المحافظة</option><option>عمّان</option><option>الزرقاء</option><option>إربد</option><option>جرش</option><option>عجلون</option><option>المفرق</option><option>البلقاء</option><option>مادبا</option><option>الكرك</option><option>الطفيلة</option><option>معان</option><option>العقبة</option></select></div><div class="field"><label>الكمية</label><select id="qty" name="qty"><option value="1">1 مجموعة</option><option value="2">2 مجموعات</option><option value="3">3 مجموعات</option></select></div>
<div class="field full"><label>العنوان</label><textarea name="address" required rows="2" placeholder="المنطقة - أقرب نقطة دالة"></textarea></div></div>
<div class="summary"><span>الإجمالي</span><span id="total"></span></div><button class="submit">تأكيد الطلب</button></form></div></div></section>
<footer id="footer"></footer>
<div class="mobile"><a class="cta ctaText" href="#order"></a></div>
<div class="success" id="success"><div><div style="font-size:40px">✅</div><h3>تم استلام طلبك</h3><p>سنتواصل معك لتأكيد الطلب.</p><button class="close" id="closeSuccess">إغلاق</button></div></div>
<script>
const DEFAULT_CONTENT={topBar:'خصم خاص لفترة محدودة — التوصيل مجاني داخل الأردن 🇯🇴',heroBadge:'حصريًا في الأردن',heroTitle:'أسهل وأسرع طريقة لتعلّم الإنجليزية من الصفر',heroLead:'5000 جملة + 2000 كلمة + خطة يومية + صوتيات أمريكية + هدايا عملية.',priceNow:'39.5',priceOld:'80',currency:'دينار',heroImage:'https://jordan.englishmasters.store/wp-content/uploads/2023/04/cover-1024x731.jpeg',cta:'اطلب الآن',timerText:'العرض على وشك الانتهاء',benefitsTitle:'كل اللي تحتاجه في مكان واحد',benefits:['5000 جملة عملية','2000 كلمة أساسية','خطة يومية واضحة','صوتيات للنطق','إنجليزي للشغل والسفر','هدايا إضافية'],problemTitle:'ليش المجموعة مختلفة؟',problemText:'بدل ما تضيّع وقتك بين عشرات المصادر، المجموعة مرتبة لتعرف ماذا تدرس وكيف تبدأ وتتابع بخطة واضحة.',packageTitle:'المجموعة كاملة بسعر واحد',packageImage:'https://jordan.englishmasters.store/wp-content/uploads/2023/04/%D8%B5%D9%88%D8%B1%D8%A9-%D9%85%D8%AC%D9%85%D8%B9%D8%A9-2048x668-1-1.png',packageItems:['أهم الجمل والكلمات المستخدمة يوميًا','خطة تساعدك تبدأ بدون تشتت','تسجيلات صوتية للنطق','محتوى للشغل والسفر والمقابلات','هدايا وكتيبات إضافية'],giftsTitle:'هدايا مع المجموعة',gifts:['خريطة إتقان اللغة الإنجليزية','ذاكرة ضد النسيان','كيف تتعلم الإنجليزية مثل الأطفال','مقابلة عمل بلا أخطاء','أهم الكلمات المستخدمة','تسجيلات صوتية للجمل'],reviewsTitle:'آراء العملاء',reviews:[{name:'محمد',text:'الخطة واضحة وسهلة، وعرفت أبدأ من وين.'},{name:'آية',text:'الجمل العملية وفّرت علي وقت كبير.'},{name:'محمود',text:'المجموعة مرتبة ومناسبة للممارسة اليومية.'}],orderTitle:'اطلب مجموعتك الآن',orderHint:'أدخل بياناتك وسنتواصل لتأكيد الطلب.',footer:'English Masters الأردن — جميع الحقوق محفوظة'};
let content=DEFAULT_CONTENT;
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function render(c){content={...DEFAULT_CONTENT,...c};topBar.textContent=content.topBar;heroBadge.textContent=content.heroBadge;heroTitle.innerHTML=esc(content.heroTitle).replace('English Masters','<span>English Masters</span>');heroLead.textContent=content.heroLead;priceNow.textContent=`${content.priceNow} ${content.currency}`;priceOld.textContent=`${content.priceOld} ${content.currency}`;heroImage.src=content.heroImage;timerText.textContent=content.timerText+' — ';benefitsTitle.textContent=content.benefitsTitle;benefits.innerHTML=(content.benefits||[]).map((x,i)=>`<div class="point"><span>${['🗣️','📚','🗓️','🎧','💼','🎁'][i%6]}</span>${esc(x)}</div>`).join('');problemTitle.textContent=content.problemTitle;problemText.textContent=content.problemText;packageTitle.textContent=content.packageTitle;packageImage.src=content.packageImage;packageItems.innerHTML=(content.packageItems||[]).map(x=>`<div class="item">✓ ${esc(x)}</div>`).join('');giftsTitle.textContent=content.giftsTitle;gifts.innerHTML=(content.gifts||[]).map(x=>`<div class="gift">🎁 ${esc(x)}</div>`).join('');reviewsTitle.textContent=content.reviewsTitle;reviews.innerHTML=(content.reviews||[]).map(r=>`<div class="review"><p>“${esc(r.text)}”</p><b>${esc(r.name)}</b></div>`).join('');orderTitle.textContent=content.orderTitle;orderHint.textContent=content.orderHint;footer.textContent=content.footer;document.querySelectorAll('.ctaText').forEach(a=>a.textContent=content.cta);updateTotal()}
async function load(){try{const r=await fetch('/api/content',{cache:'no-store'});if(r.ok){const j=await r.json();if(j.content)render(j.content);else render(DEFAULT_CONTENT)}else render(DEFAULT_CONTENT)}catch{render(DEFAULT_CONTENT)}}
const key='em_offer_end';let end=Number(localStorage.getItem(key));if(!end||end<Date.now()){end=Date.now()+6*60*60*1000;localStorage.setItem(key,end)}function tick(){let d=Math.max(0,end-Date.now()),h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);hours.textContent=String(h).padStart(2,'0');mins.textContent=String(m).padStart(2,'0');secs.textContent=String(s).padStart(2,'0')}setInterval(tick,1000);tick();
function updateTotal(){const q=Number(qty.value||1),p=Number(content.priceNow||0);total.textContent=(p*q).toFixed(1)+' '+content.currency+' — التوصيل مجاني'}qty.addEventListener('change',updateTotal);
orderForm.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());data.total=Number(content.priceNow||0)*Number(data.qty||1);const btn=e.target.querySelector('button');const old=btn.textContent;btn.disabled=true;btn.textContent='جاري إرسال الطلب...';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error();success.style.display='flex';e.target.reset();updateTotal()}catch{alert('تعذر إرسال الطلب الآن. حاول مرة أخرى.')}finally{btn.disabled=false;btn.textContent=old}});closeSuccess.onclick=()=>success.style.display='none';load();
</script></body></html>
